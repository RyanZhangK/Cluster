name: Build & Release (22.04)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to build (leave empty for branch HEAD)'
        required: false
        default: ''
      tag_name:
        description: 'Release tag (leave empty for auto-generate from commit SHA)'
        required: false
        default: ''

jobs:
  build:
    name: Build Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG="build-${SHORT_SHA}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            patchelf \
            rsync \
            libarchive-tools \
            libgl1 \
            libegl1 \
            libasound2 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxkbcommon0
          pip install --upgrade pip
          pip install uv
          sudo apt-get update -qq && sudo apt-get install -y -qq libxcb-cursor0 libxkbcommon-x11-0

      - name: Run Tests
        run: uv run pytest

      - name: Install fpm
        run: |
          sudo gem install fpm

      - name: Build packages
        env:
          PKG_VERSION: ${{ steps.version.outputs.tag_name }}
        run: make all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: build/pkg/*

  build-flasher-linux:
    name: Build Flasher (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake libgl-dev libx11-dev libxrandr-dev libwayland-dev libxkbcommon-dev python3 python3-pip

      - name: Build flasher
        run: make flasher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluster-flasher-linux-${{ matrix.arch }}
          path: |
            build/flasher-cpp/bin/cluster-flasher
            build/flasher-cpp/bin/esptool

  build-flasher-win:
    name: Build Flasher (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pyinstaller esptool pyserial

      - name: Build flasher
        run: |
          cmake -S tools/flasher-cpp -B build/flasher-cpp -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUNDLE_ESPTOOL=ON
          cmake --build build/flasher-cpp

      - name: Package (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path @("build/flasher-cpp/bin/cluster-flasher.exe", "build/flasher-cpp/bin/esptool.exe") -DestinationPath "build/cluster-flasher-win64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluster-flasher-win64
          path: build/cluster-flasher-win64.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-flasher-linux, build-flasher-win]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: packages-*
          merge-multiple: true

      - name: Download flasher artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/flasher/
          pattern: cluster-flasher-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: "Cluster ${{ needs.build.outputs.tag_name }}"
          generate_release_notes: true
          target_commitish: ${{ needs.build.outputs.commit_sha }}
          files: |
            artifacts/*.deb
            artifacts/*.pkg.tar.zst
            artifacts/flasher/**
